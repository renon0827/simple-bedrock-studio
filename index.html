<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
<title>Simple Bedrock Studio</title>
<style>
  :root {
    --bg: #f6f5f2;
    --surface: #ffffff;
    --surface-2: #efede8;
    --text: #1d1d1f;
    --muted: #6b6a66;
    --border: #dddad3;
    --accent: #1f6feb;
    --accent-text: #ffffff;
    --danger: #c0392b;
    --danger-bg: #fdecea;
    --user-bubble: #1f6feb;
    --user-text: #ffffff;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a;
      --surface: #202226;
      --surface-2: #2a2d32;
      --text: #ececec;
      --muted: #9a9a9f;
      --border: #34373d;
      --accent: #4c8dff;
      --accent-text: #0b0c0e;
      --danger: #ff7b6e;
      --danger-bg: #3a2020;
      --user-bubble: #2f5fb3;
      --user-text: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .01em; }
  .key-state { font-size: 13px; color: var(--muted); }
  .key-state.ok { color: #2e9d57; }

  details.card, .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
  }
  details.card > summary { cursor: pointer; font-weight: 600; list-style: none; }
  details.card > summary::-webkit-details-marker { display: none; }
  details.card > summary::after { content: "▾"; float: right; color: var(--muted); }
  details.card[open] > summary::after { content: "▴"; }
  details.card[open] > summary { margin-bottom: 10px; }

  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input, select, textarea, button { font: inherit; }
  input[type=text], input[type=password], input[type=number], select, textarea {
    width: 100%;
    /* 16px 以上にして iOS のズームを防ぐ */
    font-size: 16px;
    padding: 10px 12px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 88px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row > div { min-width: 0; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); margin-top: 10px; }
  .hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }

  button {
    border: 0; border-radius: 10px; padding: 12px 16px; cursor: pointer;
    background: var(--surface-2); color: var(--text);
  }
  button.primary { background: var(--accent); color: var(--accent-text); font-weight: 600; width: 100%; margin-top: 14px; }
  button:disabled { opacity: .55; cursor: default; }
  button.small { padding: 6px 10px; font-size: 13px; }

  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 12px; margin-bottom: 12px; }
  .tabs button { background: transparent; padding: 10px; font-weight: 600; color: var(--muted); }
  .tabs button[aria-selected=true] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  [hidden] { display: none !important; }

  .error {
    background: var(--danger-bg); color: var(--danger);
    border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-top: 12px;
    white-space: pre-wrap; word-break: break-word;
  }
  .status { font-size: 13px; color: var(--muted); margin-top: 10px; min-height: 1em; }

  .gallery { display: grid; gap: 12px; }
  .shot { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .shot img { display: block; width: 100%; height: auto; background: var(--surface-2); }
  .shot .meta { padding: 10px 12px; font-size: 13px; color: var(--muted); display: flex; gap: 10px; align-items: center; justify-content: space-between; }
  .shot .meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .shot a { color: var(--accent); text-decoration: none; flex: none; }

  .chat { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .msg { padding: 10px 12px; border-radius: 14px; max-width: 88%; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--user-bubble); color: var(--user-text); border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg .usage { display: block; margin-top: 6px; font-size: 11px; color: var(--muted); }
  .chat-empty { text-align: center; color: var(--muted); font-size: 14px; padding: 24px 0; }
  .composer { position: sticky; bottom: 0; background: var(--bg); padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); }
  .composer-inner { display: flex; gap: 8px; align-items: flex-end; }
  .composer textarea { min-height: 48px; max-height: 40vh; }
  .composer button { flex: none; margin: 0; width: auto; }
  .toolbar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  footer { font-size: 12px; color: var(--muted); text-align: center; padding: 16px 0 24px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Simple Bedrock Studio</h1>
    <span id="keyState" class="key-state">APIキー未設定</span>
  </header>

  <details class="card" id="settings">
    <summary>設定</summary>
    <label for="apiKey">Bedrock APIキー</label>
    <input id="apiKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ABSK... または bedrock-api-key-...">
    <label class="check"><input id="rememberKey" type="checkbox"> この端末に保存する（ブラウザ内のみ）</label>
    <p class="hint">キーは AWS（bedrock-runtime）への通信にだけ使い、ほかのサーバーには送信しません。共用端末では保存しないでください。</p>
  </details>

  <div class="tabs" role="tablist">
    <button role="tab" id="tabImage" aria-selected="true" data-panel="panelImage">画像生成</button>
    <button role="tab" id="tabChat" aria-selected="false" data-panel="panelChat">チャット</button>
  </div>

  <!-- 画像生成 -->
  <section id="panelImage" role="tabpanel">
    <div class="card">
      <div class="row">
        <div>
          <label for="imgModel">モデル</label>
          <select id="imgModel"></select>
        </div>
        <div>
          <label for="imgRegion">リージョン</label>
          <select id="imgRegion"></select>
        </div>
      </div>
      <p class="hint" id="imgModelHint"></p>

      <label for="imgPrompt">プロンプト（英語推奨）</label>
      <textarea id="imgPrompt" placeholder="a cat astronaut floating in space, watercolor"></textarea>

      <label for="imgNegative">ネガティブプロンプト（任意）</label>
      <input id="imgNegative" type="text" placeholder="blurry, low quality">

      <div class="row">
        <div>
          <label for="imgSize">サイズ / 比率</label>
          <select id="imgSize"></select>
        </div>
        <div>
          <label for="imgSeed">シード（任意）</label>
          <input id="imgSeed" type="number" inputmode="numeric" min="0" placeholder="ランダム">
        </div>
      </div>

      <button class="primary" id="imgGo">生成する</button>
      <div class="status" id="imgStatus"></div>
      <div class="error" id="imgError" hidden></div>
    </div>
    <div class="gallery" id="gallery"></div>
  </section>

  <!-- チャット -->
  <section id="panelChat" role="tabpanel" hidden>
    <div class="card">
      <div class="row">
        <div>
          <label for="chatModel">モデルID</label>
          <input id="chatModel" type="text" list="chatModels" autocapitalize="off" spellcheck="false">
          <datalist id="chatModels"></datalist>
        </div>
        <div>
          <label for="chatRegion">リージョン</label>
          <select id="chatRegion"></select>
        </div>
      </div>
      <p class="hint">候補以外のモデルIDもそのまま入力できます。<code>us.</code> / <code>apac.</code> / <code>jp.</code> などの接頭辞はリージョンに合わせてください。</p>
      <label for="chatSystem">システムプロンプト（任意）</label>
      <input id="chatSystem" type="text" placeholder="あなたは親切なアシスタントです">
    </div>

    <div class="toolbar"><button class="small" id="chatClear">会話をリセット</button></div>
    <div class="chat" id="chatLog"><div class="chat-empty">メッセージを送ってみましょう</div></div>
    <div class="error" id="chatError" hidden></div>

    <div class="composer">
      <div class="composer-inner">
        <textarea id="chatInput" rows="1" placeholder="メッセージ"></textarea>
        <button class="primary" id="chatGo">送信</button>
      </div>
    </div>
  </section>

  <footer>
    <a href="https://github.com/renon0827/simple-bedrock-studio">GitHub</a> · 料金は AWS アカウントに通常どおり課金されます
  </footer>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  // ---------- 保存（localStorage は使えない環境もあるので必ず try/catch） ----------
  const store = {
    get(k) { try { return localStorage.getItem('sbs.' + k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem('sbs.' + k, v); } catch {} },
    del(k) { try { localStorage.removeItem('sbs.' + k); } catch {} },
  };

  // ---------- 定義 ----------
  const REGIONS = [
    'us-east-1', 'us-east-2', 'us-west-2',
    'ap-northeast-1', 'ap-northeast-3', 'ap-southeast-1', 'ap-southeast-2',
    'eu-central-1', 'eu-west-1', 'eu-west-3',
  ];

  const NOVA_SIZES = [
    ['1024x1024', '1024×1024（正方形）'],
    ['1280x720', '1280×720（横 16:9）'],
    ['720x1280', '720×1280（縦 9:16）'],
    ['1152x896', '1152×896（横 4:3 相当）'],
    ['896x1152', '896×1152（縦 3:4 相当）'],
    ['512x512', '512×512（小・安い）'],
  ];
  const STABILITY_RATIOS = ['1:1', '16:9', '9:16', '3:2', '2:3', '4:5', '5:4', '21:9', '9:21']
    .map((r) => [r, r]);

  const IMAGE_MODELS = [
    { id: 'amazon.nova-canvas-v1:0', name: 'Amazon Nova Canvas', kind: 'nova', region: 'us-east-1',
      hint: 'us-east-1 / ap-northeast-1 / eu-west-1 で利用できます。' },
    { id: 'stability.stable-image-core-v1:1', name: 'Stable Image Core', kind: 'stability', region: 'us-west-2',
      hint: 'Stability AI 系は主に us-west-2 で提供されています。' },
    { id: 'stability.sd3-5-large-v1:0', name: 'Stable Diffusion 3.5 Large', kind: 'stability', region: 'us-west-2',
      hint: 'Stability AI 系は主に us-west-2 で提供されています。' },
    { id: 'stability.stable-image-ultra-v1:1', name: 'Stable Image Ultra', kind: 'stability', region: 'us-west-2',
      hint: 'Stability AI 系は主に us-west-2 で提供されています。高品質ですが高めです。' },
  ];

  const CHAT_MODELS = [
    'us.amazon.nova-lite-v1:0',
    'us.amazon.nova-micro-v1:0',
    'us.amazon.nova-pro-v1:0',
    'apac.amazon.nova-lite-v1:0',
    'us.anthropic.claude-haiku-4-5-20251001-v1:0',
    'us.anthropic.claude-sonnet-4-5-20250929-v1:0',
    'openai.gpt-oss-120b-1:0',
  ];

  const fillSelect = (el, items, value) => {
    el.innerHTML = '';
    for (const [v, label] of items) {
      const o = document.createElement('option');
      o.value = v; o.textContent = label;
      el.appendChild(o);
    }
    if (value && items.some(([v]) => v === value)) el.value = value;
  };

  // ---------- Bedrock 呼び出し ----------
  const endpoint = (region, modelId, action) =>
    `https://bedrock-runtime.${region}.amazonaws.com/model/${encodeURIComponent(modelId)}/${action}`;

  async function callBedrock(region, modelId, action, body) {
    const key = $('apiKey').value.trim();
    if (!key) throw new Error('設定から Bedrock APIキーを入力してください。');
    let res;
    try {
      res = await fetch(endpoint(region, modelId, action), {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${key}`,
          'Content-Type': 'application/json',
          'Accept': 'application/json',
        },
        body: JSON.stringify(body),
      });
    } catch (e) {
      throw new Error(`通信に失敗しました（リージョン名や電波状況を確認してください）\n${e.message}`);
    }
    const text = await res.text();
    let data = null;
    try { data = JSON.parse(text); } catch {}
    if (!res.ok) {
      const msg = (data && (data.message || data.Message)) || text || res.statusText;
      throw new Error(`${res.status} ${explain(res.status, msg)}`);
    }
    return data;
  }

  function explain(status, msg) {
    const tips = [];
    if (status === 403 && /not authorized|invalid|expired|token/i.test(msg))
      tips.push('APIキーが無効か期限切れの可能性があります。');
    if (/access to the model|don't have access|not have access/i.test(msg))
      tips.push('コンソールでこのモデルの利用が有効になっているか確認してください。');
    if (/on-demand throughput/i.test(msg))
      tips.push('モデルIDに us. / apac. などの推論プロファイル接頭辞を付けてみてください。');
    if (/model identifier is invalid|not supported in this region|could not resolve/i.test(msg))
      tips.push('このリージョンでは提供されていないモデルかもしれません。');
    if (status === 429) tips.push('リクエストが多すぎます。少し待って再試行してください。');
    return msg + (tips.length ? '\n→ ' + tips.join('\n→ ') : '');
  }

  // ---------- APIキー ----------
  function refreshKeyState() {
    const has = !!$('apiKey').value.trim();
    $('keyState').textContent = has ? 'APIキー設定済み' : 'APIキー未設定';
    $('keyState').classList.toggle('ok', has);
  }
  const savedKey = store.get('apiKey');
  if (savedKey) { $('apiKey').value = savedKey; $('rememberKey').checked = true; }
  else { $('settings').open = true; }
  refreshKeyState();

  const persistKey = () => {
    if ($('rememberKey').checked && $('apiKey').value.trim()) store.set('apiKey', $('apiKey').value.trim());
    else store.del('apiKey');
    refreshKeyState();
  };
  $('apiKey').addEventListener('input', persistKey);
  $('rememberKey').addEventListener('change', persistKey);

  // ---------- タブ ----------
  const tabs = [$('tabImage'), $('tabChat')];
  const showTab = (btn) => {
    for (const t of tabs) {
      const on = t === btn;
      t.setAttribute('aria-selected', String(on));
      $(t.dataset.panel).hidden = !on;
    }
    store.set('tab', btn.id);
  };
  tabs.forEach((t) => t.addEventListener('click', () => showTab(t)));
  if (store.get('tab') === 'tabChat') showTab($('tabChat'));

  // ---------- 画像生成 ----------
  const regionItems = REGIONS.map((r) => [r, r]);
  fillSelect($('imgModel'), IMAGE_MODELS.map((m) => [m.id, m.name]), store.get('imgModel'));
  fillSelect($('imgRegion'), regionItems, store.get('imgRegion') || 'us-east-1');

  const currentImageModel = () => IMAGE_MODELS.find((m) => m.id === $('imgModel').value);

  function syncImageModel(fromUser) {
    const m = currentImageModel();
    $('imgModelHint').textContent = m.hint;
    const sizes = m.kind === 'nova' ? NOVA_SIZES : STABILITY_RATIOS;
    fillSelect($('imgSize'), sizes, store.get('imgSize.' + m.kind));
    if (fromUser) {
      $('imgRegion').value = m.region;
      store.set('imgRegion', m.region);
    }
  }
  $('imgModel').addEventListener('change', () => { store.set('imgModel', $('imgModel').value); syncImageModel(true); });
  $('imgRegion').addEventListener('change', () => store.set('imgRegion', $('imgRegion').value));
  $('imgSize').addEventListener('change', () => store.set('imgSize.' + currentImageModel().kind, $('imgSize').value));
  syncImageModel(false);

  function buildImageRequest(m, prompt, negative, size, seed) {
    if (m.kind === 'nova') {
      const [width, height] = size.split('x').map(Number);
      const body = {
        taskType: 'TEXT_IMAGE',
        textToImageParams: { text: prompt },
        imageGenerationConfig: { numberOfImages: 1, width, height, quality: 'standard', cfgScale: 6.5 },
      };
      if (negative) body.textToImageParams.negativeText = negative;
      if (seed !== null) body.imageGenerationConfig.seed = seed;
      return body;
    }
    const body = { prompt, aspect_ratio: size, output_format: 'png' };
    if (negative) body.negative_prompt = negative;
    if (seed !== null) body.seed = seed;
    return body;
  }

  function base64ToBlob(b64, type) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type });
  }

  function addShot(b64, caption) {
    const blob = base64ToBlob(b64, 'image/png');
    const url = URL.createObjectURL(blob);
    const fig = document.createElement('div');
    fig.className = 'shot';
    const img = document.createElement('img');
    img.src = url; img.alt = caption;
    const meta = document.createElement('div');
    meta.className = 'meta';
    const cap = document.createElement('span');
    cap.textContent = caption;
    const a = document.createElement('a');
    a.href = url;
    a.download = `bedrock-${Date.now()}.png`;
    a.textContent = '保存';
    meta.append(cap, a);
    fig.append(img, meta);
    $('gallery').prepend(fig);
  }

  $('imgGo').addEventListener('click', async () => {
    const prompt = $('imgPrompt').value.trim();
    $('imgError').hidden = true;
    if (!prompt) { $('imgError').textContent = 'プロンプトを入力してください。'; $('imgError').hidden = false; return; }

    const m = currentImageModel();
    const seedRaw = $('imgSeed').value.trim();
    const seed = seedRaw === '' ? null : Math.max(0, parseInt(seedRaw, 10) || 0);
    const body = buildImageRequest(m, prompt, $('imgNegative').value.trim(), $('imgSize').value, seed);

    $('imgGo').disabled = true;
    const started = performance.now();
    $('imgStatus').textContent = `${m.name} で生成中…`;
    try {
      const data = await callBedrock($('imgRegion').value, m.id, 'invoke', body);
      if (data.error) throw new Error(data.error);
      const reasons = data.finish_reasons || [];
      if (reasons[0]) throw new Error(`生成が中断されました: ${reasons[0]}（コンテンツフィルタの可能性があります）`);
      const images = data.images || [];
      if (!images.length) throw new Error('画像が返ってきませんでした。\n' + JSON.stringify(data).slice(0, 500));
      const sec = ((performance.now() - started) / 1000).toFixed(1);
      images.forEach((b64) => addShot(b64, `${m.name} · ${sec}s · ${prompt}`));
      $('imgStatus').textContent = `完了（${sec}秒）。画像は長押し、または「保存」で保存できます。`;
    } catch (e) {
      $('imgStatus').textContent = '';
      $('imgError').textContent = e.message;
      $('imgError').hidden = false;
    } finally {
      $('imgGo').disabled = false;
    }
  });

  // ---------- チャット ----------
  $('chatModels').innerHTML = CHAT_MODELS.map((id) => `<option value="${id}">`).join('');
  $('chatModel').value = store.get('chatModel') || CHAT_MODELS[0];
  fillSelect($('chatRegion'), regionItems, store.get('chatRegion') || 'us-east-1');
  $('chatSystem').value = store.get('chatSystem') || '';
  $('chatModel').addEventListener('change', () => store.set('chatModel', $('chatModel').value.trim()));
  $('chatRegion').addEventListener('change', () => store.set('chatRegion', $('chatRegion').value));
  $('chatSystem').addEventListener('change', () => store.set('chatSystem', $('chatSystem').value));

  let history = [];

  function renderMsg(role, text, usage) {
    const empty = $('chatLog').querySelector('.chat-empty');
    if (empty) empty.remove();
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    if (usage) {
      const u = document.createElement('span');
      u.className = 'usage';
      u.textContent = usage;
      div.appendChild(u);
    }
    $('chatLog').appendChild(div);
    div.scrollIntoView({ block: 'end', behavior: 'smooth' });
    return div;
  }

  async function send() {
    const text = $('chatInput').value.trim();
    const modelId = $('chatModel').value.trim();
    if (!text || !modelId) return;
    $('chatError').hidden = true;

    history.push({ role: 'user', content: [{ text }] });
    renderMsg('user', text);
    $('chatInput').value = '';
    autoGrow();
    $('chatGo').disabled = true;
    const pending = renderMsg('assistant', '…');

    const body = { messages: history, inferenceConfig: { maxTokens: 2048 } };
    const system = $('chatSystem').value.trim();
    if (system) body.system = [{ text: system }];

    try {
      const started = performance.now();
      const data = await callBedrock($('chatRegion').value, modelId, 'converse', body);
      const msg = data.output && data.output.message;
      const reply = (msg && msg.content || []).map((c) => c.text || '').join('').trim() || '（空の応答）';
      history.push({ role: 'assistant', content: [{ text: reply }] });
      pending.remove();
      const u = data.usage || {};
      const sec = ((performance.now() - started) / 1000).toFixed(1);
      renderMsg('assistant', reply, `${sec}s · in ${u.inputTokens ?? '?'} / out ${u.outputTokens ?? '?'} tokens`);
    } catch (e) {
      history.pop();
      pending.remove();
      $('chatError').textContent = e.message;
      $('chatError').hidden = false;
      $('chatInput').value = text;
      autoGrow();
    } finally {
      $('chatGo').disabled = false;
    }
  }

  function autoGrow() {
    const t = $('chatInput');
    t.style.height = 'auto';
    t.style.height = Math.min(t.scrollHeight, window.innerHeight * 0.4) + 'px';
  }
  $('chatInput').addEventListener('input', autoGrow);
  $('chatGo').addEventListener('click', send);
  $('chatInput').addEventListener('keydown', (e) => {
    // PC では Ctrl/Cmd+Enter で送信（スマホの改行は通常どおり）
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); }
  });
  $('chatClear').addEventListener('click', () => {
    history = [];
    $('chatLog').innerHTML = '<div class="chat-empty">メッセージを送ってみましょう</div>';
    $('chatError').hidden = true;
  });
})();
</script>
</body>
</html>
